services:
  hapi_fhir:
    image: hapiproject/hapi
    container_name: hapi_fhir
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx3g"
      spring.datasource.url: "jdbc:h2:file:/tmp/hapi/h2"
    restart: always

  postgresql:
    image: postgres:16
    container_name: postgresql
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgresql:/var/lib/postgresql/data
    restart: always

  metabase:
    image: metabase/metabase
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase:/metabase-data
    depends_on:
      - postgresql
    restart: always

volumes:
  postgresql:
  metabase: