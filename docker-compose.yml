services:
  hapi_fhir:
    image: hapiproject/hapi
    container_name: hapi_fhir
    ports:
      - "8080:8080"
    restart: always

  postgresql:
    image: postgres:16
    container_name: postgresql
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgresql:/var/lib/postgresql/data
    restart: always

volumes:
  postgresql: